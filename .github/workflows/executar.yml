name: executar
run-name: exec ${{ inputs.rid }}

on:
  workflow_dispatch:
    inputs:
      rid:
        description: identificador
        required: true
      lang:
        description: kt, py ou js
        required: true
      codigo:
        description: codigo a correr
        required: true

permissions: {}

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Executar
        shell: bash
        env:
          LANGX: ${{ inputs.lang }}
          CODIGO: ${{ inputs.codigo }}
        run: |
          set +e
          mkdir w
          case "$LANGX" in
            py) IMG=python:3.12-alpine; FILE=main.py;  CMD="python main.py" ;;
            js) IMG=node:22-alpine;     FILE=main.js;  CMD="node main.js" ;;
            kt) IMG=zenika/kotlin;      FILE=main.kts; CMD="kotlin main.kts" ;;
            *)  echo "linguagem invalida"; exit 2 ;;
          esac
          printf '%s' "$CODIGO" > "w/$FILE"
          docker pull -q "$IMG" > /dev/null
          printf '%s%s\n' '===OB-' 'INICIO==='
          timeout -s KILL 20 docker run --rm --name ob --network none --memory 256m --cpus 1 \
            --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp -e HOME=/tmp -v "$PWD/w:/w:ro" -w /w "$IMG" sh -c "$CMD" 2>&1 | head -c 3500
          ec=${PIPESTATUS[0]}
          docker rm -f ob > /dev/null 2>&1
          printf '\n%s%s\n' '===OB-' 'FIM==='
          printf '%s%s%s\n' '===OB-' 'COD=' "$ec"
          exit "$ec"